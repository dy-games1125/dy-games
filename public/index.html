<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>라이어 게임</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; padding: 20px; background-color: #f4f6f9; max-width: 500px; margin: 0 auto; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
    #chat-box { height: 220px; border: 1px solid #e0e0e0; overflow-y: auto; padding: 10px; border-radius: 8px; background: #fafafa; margin-bottom: 10px; }
    .msg { margin-bottom: 8px; word-break: break-all; }
    .msg.system { color: #6b7280; font-size: 0.9em; font-style: italic; }
    .msg.word { font-weight: bold; color: #1e40af; }
    .rps-btns { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
    .rps-btns button { font-size: 1.2rem; padding: 12px 20px; cursor: pointer; border-radius: 8px; border: 1px solid #d1d5db; background: #ffffff; font-weight: bold; }
    .turn-highlight { background: #eef2ff; border: 2px solid #6366f1; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 10px; }
    .timer { font-size: 1.1rem; color: #dc2626; font-weight: bold; text-align: center; margin-bottom: 8px; }
    input[type="text"] { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; }
    button.btn { padding: 10px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button.btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .code-box { background: #f3f4f6; padding: 8px 12px; border-radius: 6px; font-weight: bold; color: #4f46e5; letter-spacing: 2px; }
  </style>
</head>
<body>

  <!-- 입장 / 방생성 / 방참가 영역 -->
  <div class="card" id="login-section">
    <h3 style="margin-top:0;">🎮 라이어 게임 입장</h3>
    <input type="text" id="nickname" placeholder="닉네임 입력" style="width: 100%; margin-bottom: 12px;">
    
    <div style="display: flex; gap: 8px;">
      <button onclick="createRoom()" class="btn" style="flex: 1; background: #10b981;">방 만들기</button>
    </div>
    
    <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
    
    <div style="display: flex; gap: 8px;">
      <input type="text" id="room-code-input" placeholder="방 코드 4자리" style="flex: 1;">
      <button onclick="joinRoom()" class="btn" style="flex: 1;">방 코드로 입장</button>
    </div>
  </div>

  <!-- 대기방 영역 -->
  <div class="card" id="game-section" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
      <h3 style="margin:0;">👥 접속 플레이어</h3>
      <div>방 코드: <span class="code-box" id="display-room-code">----</span></div>
    </div>
    <div id="player-list"></div>
    <br>
    <button id="start-rps-btn" onclick="startRPS()" class="btn" style="width: 100%; background: #10b981;">
      ✌️✊🖐️ 가위바위보로 순서 정하기
    </button>
  </div>

  <!-- 가위바위보 선택 영역 -->
  <div class="card" id="rps-section" style="display: none; text-align: center;">
    <h3 style="margin-top:0;">✌️✊🖐️ 가위, 바위, 보를 선택하세요!</h3>
    <div class="timer" id="timer-display">⏳ 제한시간: 25초</div>
    <div class="rps-btns">
      <button onclick="submitRPS('가위')">✌️ 가위</button>
      <button onclick="submitRPS('바위')">✊ 바위</button>
      <button onclick="submitRPS('보')">🖐️ 보</button>
    </div>
    <p id="rps-status" style="color: #6b7280; margin-bottom: 0;"></p>
  </div>

  <!-- 게임 및 단어 입력 영역 -->
  <div class="card" id="play-section" style="display: none;">
    <div class="timer" id="play-timer-display">⏳ 제한시간: 25초</div>
    <div class="turn-highlight" id="turn-info">순서를 정하는 중입니다...</div>

    <div id="chat-box"></div>

    <div style="display: flex; gap: 5px;">
      <input type="text" id="word-input" placeholder="채팅창에는 단어를 입력해주세요" disabled style="flex: 1;" onkeyup="if(event.keyCode===13) sendWord()">
      <button class="btn" id="send-btn" onclick="sendWord()" disabled style="width: 80px;">전송</button>
    </div>
  </div>

  <script>
    const socket = io();
    let myId = '';

    function createRoom() {
      const name = document.getElementById('nickname').value;
      if (!name.trim()) return alert('닉네임을 입력해 주세요.');
      socket.emit('create_room', name);
    }

    function joinRoom() {
      const name = document.getElementById('nickname').value;
      const code = document.getElementById('room-code-input').value;
      if (!name.trim()) return alert('닉네임을 입력해 주세요.');
      if (!code.trim()) return alert('방 코드를 입력해 주세요.');
      socket.emit('join_room', { nickname: name, roomCode: code });
    }

    function startRPS() {
      socket.emit('start_rps');
    }

    function submitRPS(choice) {
      socket.emit('submit_rps', choice);
      document.getElementById('rps-status').innerText = `선택 완료: ${choice} (다른 플레이어 대기 중...)`;
      document.querySelectorAll('.rps-btns button').forEach(btn => btn.disabled = true);
    }

    function sendWord() {
      const input = document.getElementById('word-input');
      if (input.value.trim() !== '') {
        socket.emit('send_word', input.value.trim());
        input.value = '';
      }
    }

    socket.on('connect', () => { myId = socket.id; });

    socket.on('room_created', (data) => {
      document.getElementById('display-room-code').innerText = data.roomCode;
      showGameUI();
    });

    socket.on('room_joined', (data) => {
      document.getElementById('display-room-code').innerText = data.roomCode;
      showGameUI();
    });

    function showGameUI() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('game-section').style.display = 'block';
      document.getElementById('play-section').style.display = 'block';
    }

    socket.on('system_message', (msg) => { addMessage('system', `[안내] ${msg}`); });

    socket.on('player_list_update', (data) => {
      document.getElementById('player-list').innerHTML = data.players.map(p => `• ${p.name}`).join('<br>');
    });

    socket.on('timer_tick', (timeLeft) => {
      document.getElementById('timer-display').innerText = `⏳ 제한시간: ${timeLeft}초`;
      document.getElementById('play-timer-display').innerText = `⏳ 제한시간: ${timeLeft}초`;
    });

    socket.on('rps_started', (msg) => {
      document.getElementById('rps-section').style.display = 'block';
      document.getElementById('rps-status').innerText = '';
      document.querySelectorAll('.rps-btns button').forEach(btn => btn.disabled = false);
      addMessage('system', msg);
    });

    socket.on('rps_result', (data) => {
      document.getElementById('rps-section').style.display = 'none';
      let resultText = `👑 <b>승자: ${data.winner.name} (${data.winner.choice})</b><br><b>[시계방향 진행 순서]</b><br>`;
      data.order.forEach((p, idx) => { resultText += `${idx + 1}번: ${p.name}<br>`; });
      addMessage('system', resultText);
    });

    socket.on('turn_update', (data) => {
      const turnDiv = document.getElementById('turn-info');
      const input = document.getElementById('word-input');
      const sendBtn = document.getElementById('send-btn');

      if (data.currentPlayerId === myId) {
        turnDiv.innerText = `🎯 지금은 [나(${data.currentPlayer})]의 순서입니다! 단어를 입력해 주세요.`;
        turnDiv.style.background = '#d1fae5';
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      } else {
        turnDiv.innerText = `⏳ 현재 순서: ${data.currentPlayer} (대기 중...)`;
        turnDiv.style.background = '#eef2ff';
        input.disabled = true;
        sendBtn.disabled = true;
      }
    });

    socket.on('receive_word', (data) => {
      addMessage('word', `${data.sender}: ${data.word}`);
    });

    function addMessage(type, text) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerHTML = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>

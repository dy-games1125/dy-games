<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>멀티 미니게임 천국</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #chat-box { width: 100%; height: 250px; border: 1px solid #ccc; overflow-y: scroll; margin-bottom: 10px; padding: 5px; }
    .opt-box { background: #f0f0f0; padding: 10px; border-radius: 5px; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>🎮 멀티 미니게임 방</h2>

  <!-- 로그인/방 입장 -->
  <div id="join-sec">
    <input type="text" id="username" placeholder="닉네임">
    <input type="text" id="room-id" placeholder="방 번호" value="1">
    <button onclick="joinRoom()">입장하기</button>
  </div>

  <!-- 게임 대기실 및 진행 화면 -->
  <div id="game-sec" style="display:none;">
    <h3>현재 인원 (<span id="player-count">0</span>/18)</h3>
    <ul id="player-list"></ul>

    <!-- 방장 전용 옵션 설정 -->
    <div id="host-panel" style="display:none;" class="opt-box">
      <h4>⚙️ 게임 모드 및 옵션 설정 (방장 전용)</h4>
      <label>게임 선택: </label>
      <select id="game-mode" onchange="updateSettings()">
        <option value="liar">라이어 게임</option>

        <option value="mafia">마피아 게임</option>
        <option value="shiritori">끝말잇기</option>
        <option value="choseong">초성 스피드 퀴즈</option>
      </select>

      <!-- 끝말잇기 옵션 -->
      <div id="option-shiritori" class="opt-box" style="display:none;">
        <label>제한 시간: </label>
        <select id="shiritori-time" onchange="updateSettings()">
          <option value="10">10초</option>
          <option value="15">15초</option>
          <option value="20">20초</option>
        </select>
        <label>글자 수: </label>
        <select id="shiritori-len" onchange="updateSettings()">
          <option value="2">2글자</option>
          <option value="3">3글자</option>
        </select>
      </div>

      <!-- 초성 퀴즈 옵션 -->
      <div id="option-choseong" class="opt-box" style="display:none;">
        <label>목표 점수: </label>
        <input type="number" id="target-score" value="6" min="6" max="20" onchange="updateSettings()">점
      </div>

      <!-- 마피아 옵션 (0 제외, 자유 조정) -->
      <div id="option-mafia" class="opt-box" style="display:none;">
        <label>낮 시간: </label>
        <input type="number" id="mafia-day" value="60" style="width:45px;" onchange="updateSettings()">초<br>
        <label>마피아: </label>
        <input type="number" id="mafia-count" value="1" min="1" style="width:40px;" onchange="updateSettings()">명
        <label>경찰: </label>
        <input type="number" id="police-count" value="1" min="1" style="width:40px;" onchange="updateSettings()">명
        <label>의사: </label>
        <input type="number" id="doctor-count" value="1" min="1" style="width:40px;" onchange="updateSettings()">명
      </div>

      <br>
      <button onclick="startGame()" style="margin-top:10px;">게임 시작</button>
    </div>

    <hr>

    <!-- 게임 진행 정보 전광판 -->
    <div id="game-status" style="font-weight:bold; color:blue;"></div>
    <div id="timer" style="color:red; font-size:1.2em;"></div>

    <!-- 채팅창 -->
    <div id="chat-box"></div>
    <input type="text" id="chat-input" placeholder="메시지/정답 입력..." onkeypress="if(event.keyCode==13) sendMessage()">
    <button onclick="sendMessage()">전송</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myId = '';
    let currentRoomId = '';

    socket.on('connect', () => { myId = socket.id; });

    function joinRoom() {
      const username = document.getElementById('username').value.trim();
      currentRoomId = document.getElementById('room-id').value.trim();

      if (!username) return alert('닉네임을 입력하세요!');

      socket.emit('join_room', { roomId: currentRoomId, username });
      document.getElementById('join-sec').style.display = 'none';
      document.getElementById('game-sec').style.display = 'block';
    }

    socket.on('update_room', ({ players, host, gameMode }) => {
      document.getElementById('player-count').innerText = players.length;
      
      const pList = document.getElementById('player-list');
      pList.innerHTML = players.map(p => `<li>${p.username} ${p.id === host ? '👑(방장)' : ''}</li>`).join('');

      // 방장 패널 제어
      if (myId === host) {
        document.getElementById('host-panel').style.display = 'block';
      } else {
        document.getElementById('host-panel').style.display = 'none';
      }

      // 옵션 UI 표시 토글
      document.getElementById('option-shiritori').style.display = gameMode === 'shiritori' ? 'block' : 'none';
      document.getElementById('option-choseong').style.display = gameMode === 'choseong' ? 'block' : 'none';
      document.getElementById('option-mafia').style.display = gameMode === 'mafia' ? 'block' : 'none';
    });

    function updateSettings() {
      const gameMode = document.getElementById('game-mode').value;
      const settings = {
        gameMode,
        shiritoriTime: document.getElementById('shiritori-time').value,
        shiritoriLen: document.getElementById('shiritori-len').value,
        targetScore: document.getElementById('target-score').value,
        mafiaDayTime: document.getElementById('mafia-day').value,
        mafiaCount: document.getElementById('mafia-count').value,
        policeCount: document.getElementById('police-count').value,
        doctorCount: document.getElementById('doctor-count').value
      };
      socket.emit('update_settings', { roomId: currentRoomId, settings });
    }

    function startGame() {
      socket.emit('start_game', { roomId: currentRoomId });
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const message = input.value;
      if (!message) return;

      socket.emit('send_message', { roomId: currentRoomId, message });
      input.value = '';
    }

    // 소켓 이벤트 수신
    socket.on('receive_message', ({ username, message }) => {
      const box = document.getElementById('chat-box');
      box.innerHTML += `<div><strong>${username}:</strong> ${message}</div>`;
      box.scrollTop = box.scrollHeight;
    });

    socket.on('system_message', (msg) => {
      const box = document.getElementById('chat-box');
      box.innerHTML += `<div style="color:gray;">[시스템] ${msg}</div>`;
      box.scrollTop = box.scrollHeight;
    });

    socket.on('game_started', ({ mode, currentWord, currentTurn }) => {
      document.getElementById('game-status').innerText = `🎮 게임 시작! (${mode.toUpperCase()} 모드)`;
      if (mode === 'shiritori') {
        document.getElementById('game-status').innerText = `제시어: [${currentWord}] | 차례: ${currentTurn}`;
      }
    });

    socket.on('shiritori_success', ({ word, nextTurn, sender }) => {
      document.getElementById('game-status').innerText = `제시어: [${word}] | 다음 차례: ${nextTurn}`;
    });

    socket.on('timer_tick', ({ timeLeft }) => {
      document.getElementById('timer').innerText = `⏱️ 남은 시간: ${timeLeft}초`;
    });

    socket.on('choseong_question', ({ choseong, scores, players }) => {
      document.getElementById('game-status').innerText = `💡 문제 초성: [ ${choseong} ]`;
      document.getElementById('timer').innerText = '';
    });

    socket.on('game_over', ({ winner, loser, reason }) => {
      document.getElementById('timer').innerText = '';
      if (winner) alert(`🏆 축하합니다! [${winner}]님이 승리하셨습니다!`);
      if (loser) alert(`💀 [${loser}]님 패배! (${reason})`);
      document.getElementById('game-status').innerText = '게임 종료';
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>미니게임 천국</title>
  <style>
    body { background-color: #2b1d0c; color: #fff; font-family: sans-serif; display: flex; justify-content: center; }
    .container { width: 420px; margin-top: 20px; }
    .card { background: #42281d; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #5a3829; }
    .opt-row { margin-top: 10px; font-size: 14px; }
    select, input[type="number"], input[type="text"] {
      background: #fff8dc; border: 1px solid #ccc; border-radius: 6px; padding: 5px; color: #333; font-weight: bold;
    }
    .btn-start {
      width: 100%; background: #00a870; color: white; border: none; padding: 10px;
      border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 12px;
    }
    #chat-box { height: 200px; background: #23140c; border-radius: 8px; padding: 10px; overflow-y: auto; color: #ffb86c; font-size: 13px; }
    .chat-input-sec { display: flex; gap: 5px; margin-top: 10px; }
    .chat-input-sec input { flex: 1; }
    .chat-input-sec button { background: #8b5a2b; color: white; border: none; border-radius: 6px; padding: 0 15px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <!-- 방 옵션 카드 -->
  <div class="card">
    <div style="display:flex; justify-content:space-between;">
      <span>👑 방장: <span id="host-name">-</span></span>
      <span>인원: <span id="player-count">0</span>/18</span>
    </div>
    <hr style="border-color:#5a3829; margin: 10px 0;">

    <div class="opt-row">
      🎮 게임 모드 선택: 
      <select id="game-mode" onchange="onModeChange()">
        <option value="liar">라이어 게임</option>
        <option value="mafia">마피아 게임 (6~18명)</option>
        <option value="shiritori">끝말잇기</option>
        <option value="choseong">초성 스피드 퀴즈 (100문항)</option>
      </select>
    </div>

    <!-- 라이어 게임 카테고리 옵션 -->
    <div id="option-liar" class="opt-row">
      카테고리: 
      <select id="liar-category" onchange="updateSettings()">
        <option value="음식">음식</option>
        <option value="동물">동물</option>
        <option value="직업">직업</option>
        <option value="장소">장소</option>
        <option value="전자제품">전자제품</option>
      </select>
    </div>

    <!-- 마피아 게임 옵션 -->
    <div id="option-mafia" class="opt-row" style="display:none;">
      낮 시간: <input type="number" id="mafia-day" value="60" style="width:45px;" onchange="updateSettings()"> 초
      <div style="margin-top: 8px;">
        마피아 <input type="number" id="mafia-count" value="1" min="1" style="width:35px;" onchange="updateSettings()"> 명 | 
        경찰 <input type="number" id="police-count" value="1" min="1" style="width:35px;" onchange="updateSettings()"> 명 | 
        의사 <input type="number" id="doctor-count" value="1" min="1" style="width:35px;" onchange="updateSettings()"> 명
      </div>
    </div>

    <!-- 끝말잇기 옵션 -->
    <div id="option-shiritori" class="opt-row" style="display:none;">
      제한 시간: 
      <select id="shiritori-time" onchange="updateSettings()">
        <option value="10">10초</option>
        <option value="15">15초</option>
        <option value="20">20초</option>
      </select>
      글자 수: 
      <select id="shiritori-len" onchange="updateSettings()">
        <option value="2">2글자</option>
        <option value="3">3글자</option>
      </select>
    </div>

    <!-- 초성 퀴즈 옵션 -->
    <div id="option-choseong" class="opt-row" style="display:none;">
      목표 점수: <input type="number" id="target-score" value="6" min="6" max="20" style="width:45px;" onchange="updateSettings()"> 점
    </div>

    <button class="btn-start" onclick="startGame()">🚀 게임 시작</button>
  </div>

  <!-- 대기실 및 채팅 창 -->
  <div class="card">
    <div id="game-status" style="text-align:center; font-weight:bold; margin-bottom:8px; color:#4deaea;">⏳ 대기 중</div>
    <div id="timer" style="text-align:center; color:#ff4d4d; font-weight:bold;"></div>
    <div id="chat-box"></div>
    <div class="chat-input-sec">
      <input type="text" id="chat-input" placeholder="정답/단어 입력" onkeypress="if(event.keyCode==13) sendMessage()">
      <button onclick="sendMessage()">전송</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const roomId = "1";
  const username = "플레이어_" + Math.floor(Math.random() * 1000);

  socket.emit('join_room', { roomId, username });

  function onModeChange() {
    const mode = document.getElementById('game-mode').value;
    
    document.getElementById('option-liar').style.display = (mode === 'liar') ? 'block' : 'none';
    document.getElementById('option-mafia').style.display = (mode === 'mafia') ? 'block' : 'none';
    document.getElementById('option-shiritori').style.display = (mode === 'shiritori') ? 'block' : 'none';
    document.getElementById('option-choseong').style.display = (mode === 'choseong') ? 'block' : 'none';

    updateSettings();
  }

  function updateSettings() {
    const mode = document.getElementById('game-mode').value;
    const settings = {
      gameMode: mode,
      liarCategory: document.getElementById('liar-category').value,
      mafiaDayTime: document.getElementById('mafia-day').value,
      mafiaCount: document.getElementById('mafia-count').value,
      policeCount: document.getElementById('police-count').value,
      doctorCount: document.getElementById('doctor-count').value,
      shiritoriTime: document.getElementById('shiritori-time').value,
      shiritoriLen: document.getElementById('shiritori-len').value,
      targetScore: document.getElementById('target-score').value
    };
    socket.emit('update_settings', { roomId, settings });
  }

  function startGame() {
    socket.emit('start_game', { roomId });
  }

  function sendMessage() {
    const input = document.getElementById('chat-input');
    if (!input.value.trim()) return;
    socket.emit('send_message', { roomId, message: input.value });
    input.value = '';
  }

  socket.on('update_room', ({ players, host, gameMode }) => {
    document.getElementById('player-count').innerText = players.length;
    const hostPlayer = players.find(p => p.id === host);
    if (hostPlayer) document.getElementById('host-name').innerText = hostPlayer.username;
  });

  socket.on('receive_message', ({ username, message }) => {
    const box = document.getElementById('chat-box');
    box.innerHTML += `<div><strong>${username}:</strong> ${message}</div>`;
    box.scrollTop = box.scrollHeight;
  });

  socket.on('system_message', (msg) => {
    const box = document.getElementById('chat-box');
    box.innerHTML += `<div style="color:#ffb86c;"><em>[시스템] ${msg}</em></div>`;
    box.scrollTop = box.scrollHeight;
  });

  socket.on('game_started', ({ mode, currentWord, currentTurn }) => {
    document.getElementById('game-status').innerText = `🎮 게임 시작! (${mode.toUpperCase()})`;
    if (mode === 'shiritori') {
      document.getElementById('game-status').innerText = `제시어: [${currentWord}] | 차례: ${currentTurn}`;
    }
  });

  socket.on('shiritori_success', ({ word, nextTurn }) => {
    document.getElementById('game-status').innerText = `제시어: [${word}] | 다음 차례: ${nextTurn}`;
  });

  socket.on('timer_tick', ({ timeLeft }) => {
    document.getElementById('timer').innerText = `⏱️ 남은 시간: ${timeLeft}초`;
  });

  socket.on('choseong_question', ({ choseong }) => {
    document.getElementById('game-status').innerText = `💡 문제 초성: [ ${choseong} ]`;
    document.getElementById('timer').innerText = '';
  });

  socket.on('game_over', ({ winner, loser, reason }) => {
    document.getElementById('timer').innerText = '';
    document.getElementById('game-status').innerText = '게임 종료';
    if (winner) alert(`🏆 [${winner}]님 승리!`);
    if (loser) alert(`💀 [${loser}]님 패배! (${reason})`);
  });
</script>
</body>
</html>
